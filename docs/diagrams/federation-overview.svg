<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">Federation overview: a gateway composes the Neo4j subgraph and a Wikipedia subgraph into one GraphQL endpoint</title><desc id="d">Clients, including grandstack-web, call the gateway on port 4000. The gateway uses a composed supergraph file and sends parts of each query to the Neo4j subgraph (grandstack-server with FEDERATION=true) and to the Wikipedia subgraph, which calls the public Wikipedia API.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="518.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="24" y="40" width="220" height="80" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="134.0" y="62" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">clients</text>
<text x="134.0" y="82" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">grandstack-web, agents,</text>
<text x="134.0" y="98" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">curl, any GraphQL client</text>
<rect x="330" y="40" width="230" height="110" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="2.6"/>
<text x="445.0" y="62" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">gateway  :4000</text>
<text x="445.0" y="82" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">Hive Gateway</text>
<text x="445.0" y="98" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">reads supergraph.graphql,</text>
<text x="445.0" y="114" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">plans each query</text>
<rect x="330" y="210" width="230" height="60" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="1.5"/>
<text x="445.0" y="232" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">supergraph.graphql</text>
<text x="445.0" y="251.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">composed by `npm run compose`</text>
<path d="M 244 80 L 330 80" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="287" y="68" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">one query</text>
<path d="M 445 210 L 445 150" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="458" y="186" font-size="11.5" font-weight="400" text-anchor="start" fill="#475569">plan</text>
<rect x="60" y="330" width="300" height="100" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="210.0" y="352" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">Neo4j subgraph  :4001</text>
<text x="210.0" y="371.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">grandstack-server, FEDERATION=true</text>
<text x="210.0" y="387.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">Movie and Person with key wikipediaTitle</text>
<rect x="640" y="330" width="300" height="100" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="790.0" y="352" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">Wikipedia subgraph  :4010</text>
<text x="790.0" y="371.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">adds `wikipedia` to Movie and Person</text>
<text x="790.0" y="387.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">caches summaries for an hour</text>
<path d="M 400 150 L 400 290 L 210 290 L 210 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="300" y="304" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">films, people, their keys</text>
<path d="M 490 150 L 490 290 L 790 290 L 790 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="640" y="304" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">entities with a key only</text>
<rect x="60" y="465" width="300" height="40" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
<text x="210.0" y="487" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">Neo4j</text>
<text x="210.0" y="506" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">bolt :7687</text>
<path d="M 210 430 L 210 465" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="640" y="465" width="300" height="40" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
<text x="790.0" y="487" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">en.wikipedia.org REST API</text>
<text x="790.0" y="506" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">public, no key</text>
<path d="M 790 430 L 790 465" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="24" y="170" width="270" height="76" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="1.5"/>
<text x="159.0" y="192" font-size="12.5" font-weight="650" text-anchor="middle" fill="#0f2233">seed/wikipedia-links.cypher</text>
<text x="159.0" y="211" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">sets wikipediaTitle on 152 of 152 films</text>
<text x="159.0" y="226" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">and 461 of 464 people, at server start</text>
