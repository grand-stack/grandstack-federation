<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">One federated query, step by step: Neo4j first, then Wikipedia for the rows that have a key</title><desc id="d">The client sends one query. The gateway asks the Neo4j subgraph for movies and their wikipediaTitle, then sends only the movies with a non-null key to the Wikipedia subgraph as entity representations. The Wikipedia subgraph answers from its cache or the Wikipedia REST API. The gateway merges the results.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="558.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="38" y="20" width="124" height="44" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="100.0" y="42" font-size="12.5" font-weight="650" text-anchor="middle" fill="#0f2233">client</text>
<line x1="100" y1="64" x2="100" y2="540" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="268" y="20" width="124" height="44" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="330.0" y="42" font-size="12.5" font-weight="650" text-anchor="middle" fill="#0f2233">gateway</text>
<line x1="330" y1="64" x2="330" y2="540" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="498" y="20" width="124" height="44" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="560.0" y="42" font-size="12.5" font-weight="650" text-anchor="middle" fill="#0f2233">Neo4j subgraph</text>
<line x1="560" y1="64" x2="560" y2="540" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="718" y="20" width="124" height="44" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="780.0" y="42" font-size="12.5" font-weight="650" text-anchor="middle" fill="#0f2233">Wikipedia subgraph</text>
<line x1="780" y1="64" x2="780" y2="540" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="878" y="20" width="124" height="44" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
<text x="940.0" y="42" font-size="12.5" font-weight="650" text-anchor="middle" fill="#0f2233">Wikipedia API</text>
<line x1="940" y1="64" x2="940" y2="540" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<path d="M 100 110 L 330 110" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="215.0" y="102" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">{ movies { wikipedia } }</text>
<path d="M 330 170 L 560 170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="445.0" y="162" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">movies { title wikipediaTitle }</text>
<path d="M 560 220 L 330 220" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="445.0" y="212" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">rows, some with a null wikipediaTitle</text>
<path d="M 330 285 L 780 285" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="555.0" y="277" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">_entities for the non-null keys only</text>
<path d="M 780 345 L 940 345" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
