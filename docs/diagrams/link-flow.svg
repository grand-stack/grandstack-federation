<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">How the Wikipedia links are built and applied: a developer script matches titles to pages, and the server stores the result at start</title><desc id="d">A developer runs resolve-links, which reads film titles and person names from the GraphQL API, looks them up in batches of 20 with the Wikipedia Action API, applies matching rules and writes seed/wikipedia-links.cypher. The server runs that file at every start and sets wikipediaTitle and wikidataId on Movie and Person nodes that have none.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="418.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="24" y="60" width="200" height="90" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="124.0" y="82" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">GraphQL API</text>
<text x="124.0" y="101.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">152 films, 464 people</text>
<text x="124.0" y="117.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">title + year, name</text>
<rect x="280" y="60" width="220" height="90" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="390.0" y="82" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">resolve-links script</text>
<text x="390.0" y="101.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">npm run links</text>
<text x="390.0" y="117.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">tries candidate titles</text>
<rect x="560" y="60" width="200" height="90" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
<text x="660.0" y="82" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">Wikipedia Action API</text>
<text x="660.0" y="101.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">20 titles per request,</text>
<text x="660.0" y="117.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">redirects followed</text>
<path d="M 224 105 L 280 105" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="252" y="93" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">read</text>
<path d="M 500 90 L 560 90" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="530" y="80" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">batch</text>
<path d="M 560 125 L 500 125" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="530" y="143" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">pages</text>
<rect x="280" y="210" width="220" height="100" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="1.5"/>
<text x="390.0" y="232" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">matching rules</text>
<text x="390.0" y="251" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">film: described as a film,</text>
<text x="390.0" y="266" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">year within one</text>
<text x="390.0" y="281" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">person: screen occupation</text>
<text x="390.0" y="296" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">not a disambiguation page</text>
<path d="M 390 150 L 390 210" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="560" y="215" width="220" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2.6"/>
<text x="670.0" y="237" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">wikipedia-links.cypher</text>
<text x="670.0" y="256.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">committed file, 152/152 films</text>
<text x="670.0" y="272.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">and 461/464 people linked</text>
<path d="M 500 260 L 560 260" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="530" y="248" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">write</text>
<rect x="800" y="215" width="176" height="90" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="888.0" y="237" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">server start</text>
<text x="888.0" y="256.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">SETUP_CYPHER_PATHS</text>
<text x="888.0" y="272.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">runs it every start</text>
<path d="M 780 260 L 800 260" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="800" y="340" width="176" height="60" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="888.0" y="362" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">Neo4j nodes</text>
<text x="888.0" y="381" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">wikipediaTitle, wikidataId</text>
<path d="M 888 305 L 888 340" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="898" y="326" font-size="12" font-weight="400" text-anchor="start" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">only if not set</text>
